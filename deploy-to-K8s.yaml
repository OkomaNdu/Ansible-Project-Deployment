---
- name: Deploy application in new namespace
  hosts: localhost
  tasks:
    - name: Create a k8s namespace
      kubernetes.core.k8s:
        name: my-app
        api_version: v1
        kind: Namespace
        state: present
    - name: Deploy nginx app
      kubernetes.core.k8s:
        src: ~/DevOps-Project/Kuberneters/nginx-config.yaml
        state: present
        namespace: my-app

  